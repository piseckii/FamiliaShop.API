<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — FamiliaShop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
  <div id="appHeader"></div>
</header>

<main class="page">
  <div style="margin-bottom:16px;">
    <a href="/pages/catalog.html" class="btn btn-ghost btn-sm">← Назад в каталог</a>
  </div>
  <div id="productContent">
    <div class="loading-overlay"><div class="spinner"></div></div>
  </div>
</main>

<!-- Review Modal -->
<div id="reviewModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Оставить отзыв</h2>
      <button class="modal-close" onclick="Modal.close('reviewModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Оценка</label>
        <div class="star-rating" id="starRating">
          <span class="star" data-v="1" onclick="setRating(1)">★</span>
          <span class="star" data-v="2" onclick="setRating(2)">★</span>
          <span class="star" data-v="3" onclick="setRating(3)">★</span>
          <span class="star" data-v="4" onclick="setRating(4)">★</span>
          <span class="star" data-v="5" onclick="setRating(5)">★</span>
        </div>
        <div class="field-error" id="ratingError">Выберите оценку</div>
      </div>
      <div class="form-group">
        <label class="form-label">Комментарий</label>
        <textarea class="form-textarea" id="reviewText" placeholder="Расскажите о товаре..."></textarea>
        <div class="field-error"></div>
      </div>
      <button class="btn btn-accent btn-full" onclick="submitReview()">Отправить отзыв</button>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
let currentProduct = null;
let selectedRating = 0;

document.addEventListener('DOMContentLoaded', async () => {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { window.location = '/pages/catalog.html'; return; }

  try {
    const [product, reviews] = await Promise.all([
      api.products.getById(id),
      api.reviews.byProduct(id)
    ]);
    currentProduct = product;
    document.title = `${product.naimenovanie} — FamiliaShop`;
    renderProduct(product, reviews);
  } catch (e) {
    document.getElementById('productContent').innerHTML = `
      <div class="empty-state"><div class="empty-state-icon">😕</div><h3>Товар не найден</h3>
      <a href="/pages/catalog.html" class="btn btn-outline">В каталог</a></div>`;
  }
});

function renderProduct(p, reviews) {
  const hasDiscount = p.skidki && p.skidki.length > 0;
  const discount = hasDiscount ? p.skidki[0] : null;
  let finalPrice = p.cena;
  if (discount && discount.tip === 'процентная') finalPrice = p.cena * (1 - discount.razmer / 100);

  document.getElementById('productContent').innerHTML = `
    <div class="product-detail">
      <div>
        <div class="product-detail-img">👕</div>
        ${hasDiscount ? `<div style="margin-top:12px;"><span class="product-badge" style="position:static;display:inline-block;">СКИДКА −${discount.razmer}${discount.tip === 'процентная' ? '%' : ' ₽'}</span></div>` : ''}
      </div>
      
      <div class="product-detail-info">
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--mid);margin-bottom:8px">${p.brand || '—'}</div>
        <h1 style="margin-bottom:16px">${p.naimenovanie}</h1>
        
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">
          <span style="font-size:2rem;font-weight:700">${fmt(finalPrice)}</span>
          ${hasDiscount ? `<span style="font-size:1.1rem;color:var(--light);text-decoration:line-through">${fmt(p.cena)}</span>` : ''}
        </div>

        ${p.srednyaya_ocenka ? `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;color:var(--mid);font-size:0.875rem">
            <span style="color:#f59e0b;font-size:1rem">${stars(p.srednyaya_ocenka)}</span>
            <strong>${p.srednyaya_ocenka}</strong>
            <span>(${p.kolichestvo_otzyvov} отзывов)</span>
          </div>
        ` : '<div style="margin-bottom:20px;color:var(--mid);font-size:0.875rem">Нет отзывов</div>'}

        <div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px;font-size:0.875rem">
          ${p.razmer ? `<div><span style="color:var(--mid)">Размер: </span><strong>${p.razmer}</strong></div>` : ''}
          ${p.artikul ? `<div><span style="color:var(--mid)">Артикул: </span><strong>${p.artikul}</strong></div>` : ''}
          ${p.kategorii && p.kategorii.length ? `<div><span style="color:var(--mid)">Категории: </span><strong>${p.kategorii.join(', ')}</strong></div>` : ''}
        </div>

        ${p.opisanie ? `<p style="color:var(--charcoal);margin-bottom:24px;line-height:1.7">${p.opisanie}</p>` : ''}

        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px">
          <button class="btn btn-accent btn-lg" onclick="App.addToCart(currentProduct)">
            🛒 Добавить в корзину
          </button>
          <button class="btn btn-outline btn-lg" onclick="CartSidebar.open()">
            Открыть корзину
          </button>
        </div>

        <!-- Reviews -->
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700">Отзывы (${reviews.length})</h3>
            <button class="btn btn-outline btn-sm" onclick="openReviewModal()">+ Написать отзыв</button>
          </div>
          <div id="reviewsList">
            ${reviews.length ? reviews.map(r => `
              <div class="review-item">
                <div class="review-meta">
                  <span class="review-author">${r.imya_pokupatelya || 'Аноним'}</span>
                  <span style="color:#f59e0b">${stars(r.ocenka)}</span>
                  <span class="review-date">${fmtDate(r.data)}</span>
                </div>
                ${r.tekst ? `<p class="review-text">${r.tekst}</p>` : ''}
              </div>
            `).join('') : `
              <div class="empty-state" style="padding:32px">
                <div class="empty-state-icon">💬</div>
                <h3>Пока нет отзывов</h3>
                <p>Будьте первым!</p>
              </div>
            `}
          </div>
        </div>
      </div>
    </div>
  `;
}

function openReviewModal() {
  if (!App.currentUser) {
    Toast.show('Войдите в аккаунт, чтобы оставить отзыв', 'error');
    Modal.open('loginModal');
    return;
  }
  // Сброс ошибок и оценки
  selectedRating = 0;
  document.querySelectorAll('#starRating .star').forEach(s => s.classList.remove('filled'));
  document.getElementById('reviewText').value = '';
  document.getElementById('ratingError').style.display = 'none';
  Modal.open('reviewModal');
}

function setRating(val) {
  selectedRating = val;
  document.querySelectorAll('#starRating .star').forEach((s, i) => {
    s.classList.toggle('filled', i < val);
  });
  document.getElementById('ratingError').style.display = 'none';
}

async function submitReview() {
  if (!selectedRating) {
    document.getElementById('ratingError').style.display = 'block';
    Toast.show('Выберите оценку', 'error');
    return;
  }
  const text = document.getElementById('reviewText')?.value?.trim();
  try {
    await api.reviews.create({
      kod_pokupatelya: App.currentUser.kod_pokupatelya,
      kod_tovara: currentProduct.kod_tovara,
      tekst: text,
      ocenka: selectedRating
    });
    Modal.close('reviewModal');
    Toast.show('Отзыв добавлен!', 'success');
    // Reload reviews
    const reviews = await api.reviews.byProduct(currentProduct.kod_tovara);
    document.getElementById('reviewsList').innerHTML = reviews.map(r => `
      <div class="review-item">
        <div class="review-meta">
          <span class="review-author">${r.imya_pokupatelya || 'Аноним'}</span>
          <span style="color:#f59e0b">${stars(r.ocenka)}</span>
          <span class="review-date">${fmtDate(r.data)}</span>
        </div>
        ${r.tekst ? `<p class="review-text">${r.tekst}</p>` : ''}
      </div>
    `).join('');
  } catch (e) {
    Toast.show(e.message, 'error');
  }
}
</script>
</body>
</html>
